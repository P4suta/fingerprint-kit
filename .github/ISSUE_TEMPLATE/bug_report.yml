name: Bug report
description: Report a reproducible defect in the supported experimental pipeline.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not attach real fingerprint captures, biometric templates, credentials, or exploit details.
        Security issues must use private vulnerability reporting.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This report does not contain real biometric data or other sensitive material.
          required: true
        - label: This concerns the documented hardware-free experimental pipeline.
          required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the minimal commands and synthetic inputs needed to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized diagnostics
      description: Include only redacted output that contains no biometric payloads or secrets.
      render: shell
