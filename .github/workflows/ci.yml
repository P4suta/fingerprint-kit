name: CI

on:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          base: >-
            ${{ github.event.merge_group.base_sha ||
            github.event.repository.default_branch }}
          filters: .github/filters/ci.yml
      - name: Validate selection
        env:
          CODE_FILTER: ${{ steps.changes.outputs.code }}
        run: jq -en --arg code "$CODE_FILTER" '$code == "true" or $code == "false"'
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: v2026.10.17
          sha256: fe6dd17e68e09682b31d2e7bb7bb755d22636ac1af5d94621e300f2ca9e9fe8a
          install_args: actionlint
      - run: mise x -- actionlint

  m0:
    name: CI (${{ matrix.os }})
    needs: [quality]
    if: needs.quality.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: cargo --version
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets
      - name: Documentation
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: Acceptance demo
        run: cargo run --locked -- demo

  required:
    name: required
    if: always()
    needs: [quality, m0]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the selected work
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -en --argjson needs "$NEEDS" '
            $needs |
            (keys == ["m0", "quality"]) and
            (.quality.result == "success") and
            (.quality.outputs.code | IN("true", "false")) and
            (.m0.result == (
              if .quality.outputs.code == "true" then "success"
              else "skipped" end
            ))
          '
